{% extends "base.html" %}
{% block title %}Sign in - Lola-Bla console{% endblock %}
{% block nav %}{% endblock %}
{% block body %}
<h1>hola! it's <em>you</em>, right?</h1>
<p class="muted">bienvenida · willkommen · welcome</p>
{% if message %}<p class="notice" role="alert">{{ message }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="username">username</label>
  <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="password">password</label>
  <div class="row">
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="button" class="secondary eye" data-toggle-password="password" aria-pressed="false" aria-label="show password"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button>
  </div>
  <button type="submit">sign in</button>
</form>
{% endblock %}
