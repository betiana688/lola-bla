{% extends "base.html" %}
{% block title %}Sign in - Lola-Bla console{% endblock %}
{% block body %}
<h1>hola! it's <em>you</em>, right?</h1>
<p class="muted">bienvenida · willkommen · welcome</p>
{% if message %}<p class="notice" role="alert">{{ message }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="username">username</label>
  <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="password">password</label>
  <div class="row">
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="button" class="secondary" data-toggle-password="password" aria-pressed="false">show</button>
  </div>
  <button type="submit">sign in</button>
</form>
{% endblock %}
