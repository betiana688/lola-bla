{% extends "base.html" %}
{% block title %}Sign in - Lola-Bla console{% endblock %}
{% block body %}
<h1>Lola-Bla console</h1>
{% if message %}<p class="notice" role="alert">{{ message }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="password">Password</label>
  <div class="row">
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="button" class="secondary" data-toggle-password="password" aria-pressed="false">Show</button>
  </div>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
